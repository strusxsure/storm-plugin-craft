name: ThunderPvPractice
version: ${project.version}
main: com.thunderpvp.thunderpvppractice.ThunderPvPractice
description: A practice plugin for PvP.
commands:
  thunderpvp:
    description: Main command for ThunderPvPractice.
    usage: /<command> [subcommand]
  duel:
    description: Challenge a player to a duel.
    usage: /<command> <player> <kit>
  accept:
    description: Accept a duel request.
    usage: /<command> [player]
  deny:
    description: Deny a duel request.
    usage: /<command> [player]
  kits:
    description: Open the kit selection GUI.
    usage: /<command>
  party:
    description: Manage parties.
    usage: /<command> [subcommand]
permissions:
  thunderpvp.admin:
    description: Grants access to all administrative commands for ThunderPvPractice.
    default: op
