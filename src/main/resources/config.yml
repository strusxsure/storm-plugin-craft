# ThunderPvPractice Configuration File

# Dueling System Settings
duels:
  ranked:
    enabled: true
  unranked:
    enabled: true
  2v2:
    enabled: true

# Matchmaking Settings
matchmaking:
  queue_update_interval: 5 # in seconds

# Arena Settings
arenas:
  schematics_folder: "arenas"
  max_arenas_per_kit: 10

# Kit Settings
kits:
  default_kit: "NoDebuff"

# Party Settings
parties:
  max_party_size: 8

# Event Settings
events:
  enabled: true
  event_interval: 3600 # in seconds

# Bot Settings
bots:
  enabled: false
  difficulty: "NORMAL"

# Scoreboard Settings
scoreboard:
  title: "&b&lThunderPvP"
  show_stats: true

# Messages
messages:
  prefix: "&8[&bThunderPvP&8] "
  duel_request_sent: "&aDuel request sent to {player}."
  duel_request_received: "&aYou have received a duel request from {player}."
  kit_created: "&aKit '{kit_name}' created successfully."
  kit_deleted: "&aKit '{kit_name}' deleted successfully."
  kit_already_exists: "&cA kit with that name already exists."
  kit_not_found: "&cA kit with that name does not exist."
  kit_list: "&aAvailable kits: {kit_list}"
  kit_usage: "&cKit Command Usage:"
  kit_create_usage: "&cUsage: /thunderpvp kit create <name>"
  kit_delete_usage: "&cUsage: /thunderpvp kit delete <name>"
  kit_list_usage: "&cUsage: /thunderpvp kit list"
  player_only_command: "&cThis command can only be used by players."
  unknown_command: "&cUnknown command. Use /thunderpvp help for a list of commands."
