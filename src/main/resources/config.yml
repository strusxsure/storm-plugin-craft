# ThunderPvPractice Configuration File

# Dueling System Settings
duels:
  duel_request_timeout: 60 # in seconds
  ranked:
    enabled: true
  unranked:
    enabled: true
  2v2:
    enabled: true

# Matchmaking Settings
matchmaking:
  queue_update_interval: 5 # in seconds

# Arena Settings
arenas:
  schematics_folder: "arenas"
  max_arenas_per_kit: 10

# Kit Settings
kits:
  default_kit: "NoDebuff"

# Party Settings
parties:
  max_party_size: 8

# Event Settings
events:
  enabled: true
  event_interval: 3600 # in seconds

# Bot Settings
bots:
  enabled: false
  difficulty: "NORMAL"

# Scoreboard Settings
scoreboard:
  title: "&b&lThunderPvP"
  show_stats: true

# Messages
messages:
  prefix: "&8[&bThunderPvP&8] "
  duel_request_sent: "&aDuel request sent to {player}."
  duel_request_received: "&aYou have received a duel request from {player}."
  kit_created: "&aKit '{kit_name}' created successfully."
  kit_deleted: "&aKit '{kit_name}' deleted successfully."
  kit_already_exists: "&cA kit with that name already exists."
  kit_not_found: "&cA kit with that name does not exist."
  kit_list: "&aAvailable kits: {kit_list}"
  kit_usage: "&cKit Command Usage:"
  kit_create_usage: "&cUsage: /thunderpvp kit create <name>"
  kit_delete_usage: "&cUsage: /thunderpvp kit delete <name>"
  kit_list_usage: "&cUsage: /thunderpvp kit list"
  player_only_command: "&cThis command can only be used by players."
  unknown_command: "&cUnknown command. Use /thunderpvp help for a list of commands."
  no_permission: "&cYou do not have permission to use this command."

  # Arena Messages
  arena_created: "&aArena '{arena_name}' created successfully."
  arena_deleted: "&aArena '{arena_name}' deleted successfully."
  arena_already_exists: "&cAn arena with that name already exists."
  arena_not_found: "&cAn arena with that name does not exist."
  arena_list: "&aAvailable arenas: {arena_list}"
  arena_spawn_set: "&aSet spawn {spawn_number} for arena '{arena_name}'."
  arena_usage: "&cArena Command Usage:"
  arena_create_usage: "&cUsage: /thunderpvp arena create <name>"
  arena_delete_usage: "&cUsage: /thunderpvp arena delete <name>"
  arena_setspawn_usage: "&cUsage: /thunderpvp arena setspawn1/setspawn2 <name>"
  arena_list_usage: "&cUsage: /thunderpvp arena list"

  # Selection Messages
  selection_pos1_set: "&aPosition 1 set."
  selection_pos2_set: "&aPosition 2 set."
  selection_not_set: "&cYou must set both positions first."

  # Duel Messages
  no_pending_request: "&cYou have no pending duel requests."
  requester_offline: "&cThe player who sent you a duel request is no longer online."
  no_arenas_available: "&cNo arenas are available right now."
  player_not_found: "&cPlayer not found."
  duel_usage: "&cUsage: /duel <player> <kit>"

  # Party Messages
  party_usage: "&cParty Command Usage:"
  party_create_usage: "&cUsage: /party create"
  party_invite_usage: "&cUsage: /party invite <player>"
  party_accept_usage: "&cUsage: /party accept"
  party_leave_usage: "&cUsage: /party leave"
  party_manage_usage: "&cUsage: /party manage"
  party_duel_usage: "&cUsage: /party duel <player>"
  party_created: "&aYou have created a party."
  party_disbanded: "&cThe party has been disbanded."
  not_party_leader: "&cYou are not the leader of your party."
  player_already_in_party: "&cThat player is already in a party."
  invite_sent: "&aYou have invited {player} to your party."
  invite_received: "&aYou have received a party invite from {player}."
  no_pending_invite: "&cYou have no pending party invites."
  party_no_longer_exists: "&cThat party no longer exists."
  player_joined_party: "&a{player} has joined the party."
  not_in_party: "&cYou are not in a party."
  player_left_party: "&c{player} has left the party."
  duel_request_denied: "&c{player} has denied your duel request."
  you_denied_request: "&aYou have denied the duel request."
  duel_starting_in: "&aDuel starting in {seconds}..."
  duel_started: "&aDuel started!"
  duel_winner: "&a{player} has won the duel!"
